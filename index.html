<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Révision Verbes Irréguliers</title>
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#4f46e5;--primary-hover:#4338ca;--bg:#f1f5f9;--card:#fff;--soft:#f8fafc;--text:#0f172a;--muted:#64748b;--border:#cbd5e1;--tab:#e2e8f0;--success:#16a34a;--error:#dc2626}
:root[data-theme=dark]{--primary:#818cf8;--primary-hover:#6366f1;--bg:#0f172a;--card:#1e293b;--soft:#162033;--text:#f1f5f9;--muted:#94a3b8;--border:#475569;--tab:#334155;--success:#4ade80;--error:#f87171}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]):not([data-theme=dark]){--primary:#818cf8;--primary-hover:#6366f1;--bg:#0f172a;--card:#1e293b;--soft:#162033;--text:#f1f5f9;--muted:#94a3b8;--border:#475569;--tab:#334155;--success:#4ade80;--error:#f87171}}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:16px 12px 32px}
header{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;width:100%;max-width:700px;margin:6px 0 18px;text-align:center}
h1{font-size:clamp(1.3rem,5.5vw,1.8rem);color:var(--primary);font-weight:700;line-height:1.2}
.subtitle{color:var(--muted);font-size:.9rem}
.gear{grid-column:3}
.acc{grid-column:1;position:relative}
.gear,.acc{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--primary);cursor:pointer;display:grid;place-items:center}
.gear svg,.acc svg{width:22px;height:22px}
.acc .dot{position:absolute;top:7px;right:7px;width:11px;height:11px;border-radius:50%;background:var(--success);border:2px solid var(--card)}
.acc .dot[hidden]{display:none}
.container{width:100%;max-width:700px;background:var(--card);border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.06);padding:20px}
@media(min-width:600px){.container{padding:24px}}
.tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--tab);padding:4px;border-radius:10px}
.tab-btn{flex:1;background:none;border:none;font-size:1rem;font-weight:600;color:var(--muted);cursor:pointer;padding:11px 6px;border-radius:8px}
.tab-btn.active{background:var(--card);color:var(--primary);box-shadow:0 2px 4px rgba(0,0,0,.08)}
.section-view{display:none}.section-view.active{display:block}
.stats-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:.85rem;color:var(--muted);font-weight:600;margin-bottom:10px;text-align:center}
.stats-bar span{background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.stats-bar strong{font-size:1.05rem;color:var(--text)}
.stats-bar small{font-size:.7rem;font-weight:600}
.mastery{display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--muted);font-weight:600;margin-bottom:16px}
.bar{flex:1;height:8px;background:var(--tab);border-radius:8px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--primary);border-radius:8px;transition:width .3s}
select,.search-bar,.input-group input{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:10px;font-size:1rem;outline:none;background:var(--card);color:var(--text)}
select{margin-bottom:12px}
select:focus,.search-bar:focus,.input-group input:focus{border-color:var(--primary)}
.quiz-card{background:var(--soft);border:2px solid var(--border);border-radius:14px;padding:20px 16px;text-align:center;margin-bottom:14px}
.quiz-prompt{font-size:.92rem;color:var(--muted);margin-bottom:10px}
.quiz-inputs{display:flex;flex-direction:column;gap:12px;margin-bottom:18px;text-align:left}
.input-group label{display:block;font-size:.85rem;font-weight:600;margin-bottom:4px;color:var(--primary)}
.input-group input.ok{border-color:var(--success)}
.input-group input.ko{border-color:var(--error)}
.input-group .answer{font-size:.85rem;color:var(--error);margin-top:3px}
.btn{background:#4f46e5;color:#fff;border:none;padding:14px;font-size:1rem;font-weight:600;border-radius:10px;cursor:pointer;width:100%}
.btn:hover:not(:disabled){background:#4338ca}
.btn:disabled{background:#94a3b8;color:#fff;cursor:not-allowed}
.btn.secondary{background:#64748b}
.btn.link{background:none;color:var(--muted);font-size:.85rem;padding:10px}
.btn.link:hover:not(:disabled){background:var(--tab);color:var(--error)}
.btn.small{padding:10px;font-size:.9rem;margin-top:10px}
.speak-btn{background:var(--tab);border:none;border-radius:20px;padding:6px 12px;font-size:1rem;cursor:pointer;color:var(--text)}
.speak-btn.mini{position:absolute;top:4px;right:4px;padding:2px 7px;font-size:.75rem}
body.no-speech .speak-btn{display:none!important}
.quiz-feedback{margin-top:14px;font-weight:600;min-height:24px}
.quiz-feedback .speak-btn{display:block;margin:10px auto 0;font-size:.9rem}
.ok-text{color:var(--success)}.ko-text{color:var(--error)}
.note{font-size:.85rem;color:var(--muted);font-weight:400}
.search-bar{margin-bottom:12px}
.controls-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
@media(max-width:600px){.controls-row{grid-template-columns:1fr 1fr}}
.toggle-col-btn{background:var(--tab);color:var(--text);border:none;padding:10px 6px;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer}
.toggle-col-btn.hidden-col{opacity:.6;text-decoration:line-through}
.empty{text-align:center;color:var(--muted);padding:20px}
.seg{display:flex;gap:4px;background:var(--tab);padding:4px;border-radius:12px;margin-bottom:12px}
.seg button{flex:1;border:none;background:none;color:var(--muted);font:inherit;font-weight:600;font-size:.88rem;padding:10px 6px;border-radius:9px;cursor:pointer;line-height:1.25}
.seg button.active{background:var(--card);color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.seg.small{margin:8px 0 0}
.setting.col{flex-direction:column;align-items:stretch;gap:0}
input:disabled{-webkit-text-fill-color:var(--text);opacity:1}
.input-group.given input{background:var(--tab);font-weight:700;border-color:var(--tab)}
.input-group label em{font-style:normal;color:var(--muted);font-weight:400}
.given-row{display:flex;gap:8px;align-items:center}
.given-row input{flex:1}
body.no-listenall .speak-all{display:none!important}
.hint{font-size:.8rem;color:var(--muted);margin-bottom:10px}
body.no-speech .hint{display:none}
.vlist{border:1px solid var(--border);border-radius:12px;overflow:clip}
.vrow{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 8px;padding:9px 12px;border-bottom:1px solid var(--border);align-items:center}
.vrow:last-child{border-bottom:none}
.vrow:nth-child(even){background:var(--soft)}
.vhead{position:sticky;top:0;z-index:1;background:var(--tab)!important;font-size:.7rem;text-transform:uppercase;font-weight:700;color:var(--muted)}
.vhead .fr{display:none}
.vcell{font-weight:700;font-size:.92rem;overflow-wrap:anywhere;min-height:22px}
.vcell.fr{grid-column:1/-1;font-weight:400;color:var(--muted);font-size:.85rem}
.hidden-text{display:inline-block;min-width:60%;background:var(--border);color:transparent!important;border-radius:4px;user-select:none;cursor:pointer}
@media(min-width:600px){.vrow{grid-template-columns:1fr 1fr 1fr 1.5fr}.vcell.fr{grid-column:auto;font-size:.92rem}.vhead .fr{display:block}}
.az{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.az:empty,body.no-letters .az{display:none}
.az button{flex:none;width:34px;height:34px;border:none;border-radius:50%;background:var(--tab);color:var(--text);font:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
body.no-speech #voice-block{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-weight:600;font-size:.88rem;padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap}
.chip.active{background:#4f46e5;border-color:#4f46e5;color:#fff}
.chip.plus{width:40px;padding:8px 0;font-size:1.15rem;line-height:1;color:var(--primary);border-style:dashed}
.list-actions{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:.85rem;color:var(--muted);font-weight:600}
.list-actions span{flex:1}
.mini-btn{border:none;background:var(--tab);color:var(--text);font:inherit;font-size:.8rem;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer}
.picker{max-height:38dvh;overflow:auto;border:1px solid var(--border);border-radius:10px;margin:8px 0 12px}
.pick{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.pick:last-child{border-bottom:none}
.pick input{width:20px;height:20px;accent-color:#4f46e5;flex:none}
.pick span{margin-left:auto;text-align:right;color:var(--muted);font-size:.8rem}
.pick-top{display:flex;align-items:center;justify-content:space-between;font-size:.85rem;color:var(--muted);font-weight:600}
.pick-top .btn{width:auto;padding:4px 8px;margin:0}
.err{color:var(--error);font-size:.85rem;min-height:1.3em;margin-bottom:4px}
.note-p{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.vlist{border:1px solid var(--border);border-radius:12px;overflow:clip}
@media(min-width:600px){.vcell .speak-btn{display:none!important}}
@media(max-width:599px){
  .az{flex-wrap:nowrap;overflow-x:auto;position:sticky;top:0;z-index:3;background:var(--card);padding:8px 0;scrollbar-width:none}
  .az::-webkit-scrollbar{display:none}
  .vlist{border:none;border-radius:0;overflow:visible;display:flex;flex-direction:column;gap:12px}
  .vrow.vhead{display:none}
  .vrow{grid-template-columns:1fr 1fr;align-items:stretch;gap:10px;padding:12px;border:2px solid var(--border)!important;border-radius:12px;background:var(--soft)!important;scroll-margin-top:64px}
  .vcell{position:relative;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 8px;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:1rem;overflow-wrap:break-word}
  .vcell::before{content:attr(data-label);font-size:.7rem;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
  .vcell.en::before{align-self:stretch;padding:0 22px}
  .vcell.fr{grid-column:auto;color:var(--text);font-weight:700;font-size:.92rem}
}
dialog{margin:auto;width:min(92vw,400px);border:1px solid var(--border);border-radius:16px;padding:22px;background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(15,23,42,.5)}
dialog h2{font-size:1.2rem;color:var(--primary);margin-bottom:10px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.setting small{display:block;color:var(--muted);font-size:.75rem}
.setting select{width:auto;margin:0;padding:8px 10px}
.switch{position:relative;width:50px;height:28px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;inset:0;z-index:1;cursor:pointer}
.switch i{position:absolute;inset:0;background:var(--border);border-radius:28px;transition:.2s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+i{background:var(--primary)}
.switch input:checked+i::after{transform:translateX(22px)}
dialog .btn{margin-top:12px}
</style>
</head>
<body>
<header>
  <button class="acc" onclick="openAccount()" aria-label="Compte">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span class="dot" id="acc-dot" hidden></span>
  </button>
  <div><h1>Verbes Irréguliers</h1><p class="subtitle">Espace de révision interactif</p></div>
  <button class="gear" onclick="openSettings()" aria-label="Paramètres">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<main class="container">
  <div class="tabs" role="tablist">
    <button class="tab-btn active" id="tab-quiz" role="tab" onclick="switchTab('quiz')">🎯 Mode Quiz</button>
    <button class="tab-btn" id="tab-list" role="tab" onclick="switchTab('list')">📖 Mode Liste</button>
  </div>

  <section id="quiz-section" class="section-view active">
    <div class="chips" id="chips-quiz"></div>
    <div class="seg" id="mode-seg" role="group" aria-label="Mode de révision">
      <button type="button" data-v="srs" class="active" onclick="setMode('srs')">🧠 Répétition espacée</button>
      <button type="button" data-v="all" onclick="setMode('all')">🎲 Au hasard</button>
    </div>
    <div class="stats-bar">
      <span id="score-text"></span>
      <span id="streak-text"></span>
      <span id="due-text"></span>
    </div>
    <div class="mastery"><span id="mastery-text"></span><div class="bar"><span id="mastery-bar"></span></div></div>
    <div class="quiz-card">
      <div class="quiz-prompt" id="q-prompt-text"></div>
      <div class="quiz-inputs" id="quiz-inputs-container"></div>
      <button class="btn" id="submit-btn" onclick="checkAnswer()" disabled>Valider</button>
      <div class="quiz-feedback" id="q-feedback" aria-live="polite"></div>
    </div>
    <button class="btn secondary" id="next-btn" onclick="nextQuestion()" disabled>Verbe suivant ➔</button>
  </section>

  <section id="list-section" class="section-view">
    <div class="chips" id="chips-list"></div>
    <div id="list-actions"></div>
    <input type="search" class="search-bar" id="search-input" placeholder="🔍 Rechercher..." oninput="renderTables()">
    <div class="controls-row" id="controls-row"></div>
    <p class="hint">👆 Touche un mot anglais pour l'écouter</p>
    <div class="az" id="az"></div>
    <div id="tables-container"></div>
  </section>
</main>

<dialog id="settings">
  <h2>⚙️ Paramètres</h2>
  <div class="setting">
    <div>Bouton « écouter » 🔊<small id="speech-note">Prononciation en anglais</small></div>
    <label class="switch"><input type="checkbox" id="set-speech" onchange="setSetting('speech', this.checked)"><i></i></label>
  </div>
  <div class="setting">
    <div>Écouter les 3 formes<small>Affiché après chaque réponse du quiz</small></div>
    <label class="switch"><input type="checkbox" id="set-listenall" onchange="setSetting('listenAll', this.checked)"><i></i></label>
  </div>
  <div class="setting">
    <div>Barre de lettres A–Z<small>Dans le mode liste</small></div>
    <label class="switch"><input type="checkbox" id="set-letters" onchange="setSetting('letters', this.checked)"><i></i></label>
  </div>
  <div class="setting col" id="voice-block">
    <div>Voix anglaise<small id="voice-info"></small></div>
    <div class="seg small" id="accent-seg" role="group" aria-label="Accent">
      <button type="button" data-v="auto" onclick="setSetting('accent','auto')">Auto</button>
      <button type="button" data-v="us" onclick="setSetting('accent','us')">Américaine</button>
      <button type="button" data-v="uk" onclick="setSetting('accent','uk')">Britannique</button>
    </div>
    <button type="button" class="btn secondary small" onclick="testVoice()">▶ Tester la voix</button>
  </div>
  <div class="setting col">
    <div>Thème</div>
    <div class="seg small" id="theme-seg" role="group" aria-label="Thème">
      <button type="button" data-v="auto" onclick="setSetting('theme','auto')">Auto</button>
      <button type="button" data-v="light" onclick="setSetting('theme','light')">Clair</button>
      <button type="button" data-v="dark" onclick="setSetting('theme','dark')">Sombre</button>
    </div>
  </div>
  <button class="btn link" onclick="resetStats()">🗑️ Réinitialiser ma progression</button>
  <button class="btn" onclick="document.getElementById('settings').close()">Fermer</button>
</dialog>

<dialog id="list-editor">
  <h2 id="le-title">Nouvelle liste</h2>
  <input id="le-name" class="search-bar" type="text" maxlength="30" placeholder="Nom de la liste (ex : Leçon 1)" autocomplete="off">
  <input id="le-search" class="search-bar" type="search" placeholder="🔍 Chercher un verbe..." oninput="renderPicker()">
  <div class="pick-top"><span id="le-count"></span><button type="button" class="btn link" onclick="clearPicker()">Tout décocher</button></div>
  <div class="picker" id="le-picker"></div>
  <div class="err" id="le-error"></div>
  <button class="btn" onclick="saveList()">Enregistrer</button>
  <button class="btn link" onclick="document.getElementById('list-editor').close()">Annuler</button>
</dialog>

<dialog id="account">
  <h2>👤 Compte</h2>
  <div id="account-body"></div>
  <button class="btn" onclick="document.getElementById('account').close()">Fermer</button>
</dialog>

<script>

/* ============ COMPTES EN LIGNE (facultatif) ============
   Sans configuration, les listes sont enregistrées sur l'appareil.
   Pour activer les comptes (listes synchronisées partout) :
   1. console.firebase.google.com > créer un projet gratuit
   2. Authentication > Sign-in method > activer « E-mail/Mot de passe »
   3. Firestore Database > créer la base, puis onglet Règles :
        rules_version = '2';
        service cloud.firestore { match /databases/{db}/documents {
          match /users/{uid} { allow read, write: if request.auth != null && request.auth.uid == uid; } } }
   4. Paramètres du projet > Vos applications > Web (</>) > copier la config ci-dessous :
        const FIREBASE_CONFIG = { apiKey: "...", authDomain: "...", projectId: "...", appId: "..." };
   5. Authentication > Paramètres > Domaines autorisés : ajouter anonyme404-dev.github.io */
const FIREBASE_CONFIG = null;

const verbsData = RAW.split('\n').map(l => { const [base,preterit,participle,french] = l.split('|'); return {base,preterit,participle,french}; })
  .sort((a,b) => a.base.localeCompare(b.base));

const keys = ['base','preterit','participle','french'];
const meta = {base:"Base Verbale",preterit:"Prétérit",participle:"Participe Passé",french:"Traduction"};
const short = {base:"Base",preterit:"Prétérit",participle:"Participe",french:"Traduction"};
const accent = {base:'#6366f1',preterit:'#8b5cf6',participle:'#ec4899',french:'#14b8a6'};

/* ---------- Sauvegarde locale (progression + paramètres) ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
let hiddenCols = store.get('hiddenCols', [false,false,false,false]);
let settings = Object.assign({speech:true, listenAll:false, letters:false, accent:'auto', theme:'auto'}, store.get('settings', {}));

/* ---------- Paramètres ---------- */
const canSpeak = 'speechSynthesis' in window;
const syncSeg = (id, val) => document.querySelectorAll('#'+id+' button').forEach(b => b.classList.toggle('active', b.dataset.v === val));
function applySettings(){
  document.body.classList.toggle('no-speech', !settings.speech || !canSpeak);
  document.body.classList.toggle('no-listenall', !settings.listenAll);
  document.body.classList.toggle('no-letters', !settings.letters);
  if (settings.theme === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = settings.theme;
  syncSeg('theme-seg', settings.theme);
  syncSeg('accent-seg', settings.accent);
}
function setSetting(k, v){ settings[k] = v; store.set('settings', settings); if (k === 'accent') pickVoice(); applySettings(); }
function openSettings(){
  const sp = document.getElementById('set-speech'), la = document.getElementById('set-listenall');
  sp.checked = settings.speech && canSpeak; sp.disabled = !canSpeak;
  la.checked = settings.listenAll; la.disabled = !canSpeak;
  document.getElementById('set-letters').checked = settings.letters;
  document.getElementById('speech-note').textContent = canSpeak ? 'Prononciation en anglais' : 'Non disponible sur ce navigateur';
  pickVoice();
  document.getElementById('settings').showModal();
}
document.getElementById('settings').addEventListener('click', e => { if (e.target.id === 'settings') e.target.close(); });

/* ---------- Prononciation (anglais) ---------- */
let enVoice = null, voiceLang = 'en-US';
const ACCENTS = { auto: ['en-US','en-GB'], us: ['en-US'], uk: ['en-GB'] };
function pickVoice(){
  if (!canSpeak) return;
  const code = l => l.replace('_','-').toLowerCase();
  const vs = speechSynthesis.getVoices().filter(v => code(v.lang).startsWith('en'));
  const prefs = ACCENTS[settings.accent] || ACCENTS.auto;
  enVoice = null;
  for (const p of prefs){
    const m = vs.filter(v => code(v.lang) === p.toLowerCase());
    if (m.length){ enVoice = m.find(v => v.localService) || m[0]; break; }
  }
  if (!enVoice) enVoice = vs[0] || null;
  voiceLang = enVoice ? enVoice.lang.replace('_','-') : prefs[0];
  const info = document.getElementById('voice-info');
  if (info) info.textContent = enVoice ? `Voix utilisée : ${enVoice.name} (${enVoice.lang})` : "Aucune voix anglaise détectée : l'appareil choisira la sienne.";
}
if (canSpeak){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text){
  if (!canSpeak || !settings.speech) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\//g, ', '));
  u.lang = voiceLang;
  if (enVoice) u.voice = enVoice;
  u.rate = 0.9;
  speechSynthesis.speak(u);
}
const testVoice = () => speak('Hello! Be, was, been.');

/* ---------- Comparaison tolérante ---------- */
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim();
const accepted = val => norm(val).split(/[\/,]/).map(s => s.trim()).filter(Boolean);
const isCorrect = (input, expected) => accepted(expected).includes(norm(input));

/* ---------- Répétition espacée (boîtes de Leitner) ---------- */
const DAY = 864e5;
const GAPS = [0, 1, 3, 7, 14];
let srs = store.get('srs', {});
const entry = v => srs[v.base] || { box: 0, due: 0 };
let lists = store.get('lists', []);
let quizList = 'all', viewList = 'all';
const listById = id => lists.find(l => l.id === id);
function poolVerbs(){ const l = listById(quizList); return l ? verbsData.filter(v => l.bases.includes(v.base)) : verbsData; }
const dueList = () => poolVerbs().filter(v => entry(v).due <= Date.now());

let mode = 'srs', current = null, givenKey = 'base', tab = 'quiz';
let score = 0, total = 0, streak = 0, answered = false, retry = [];
let lastRetry = false;

function pickNext(){
  const r = lastRetry ? -1 : retry.findIndex(x => x.at <= total);
  if (r >= 0){
    lastRetry = true;
    const b = retry.splice(r, 1)[0].base;
    return verbsData.find(v => v.base === b);
  }
  lastRetry = false;
  let list = mode === 'srs' ? dueList() : poolVerbs();
  if (!list.length) list = [...poolVerbs()].sort((a,b) => entry(a).due - entry(b).due).slice(0, 5);
  const others = list.filter(v => !current || v.base !== current.base);
  if (others.length) list = others;
  const weights = list.map(v => mode === 'srs' ? 5 - entry(v).box : 1);
  let n = Math.random() * weights.reduce((a,b) => a + b, 0);
  for (let i = 0; i < list.length; i++){ n -= weights[i]; if (n <= 0) return list[i]; }
  return list[list.length - 1];
}

function record(ok){
  const e = entry(current);
  const box = ok ? Math.min(e.box + 1, GAPS.length - 1) : 0;
  srs[current.base] = { box, due: Date.now() + GAPS[box] * DAY };
  store.set('srs', srs);
  if (!ok && !retry.some(x => x.base === current.base)) retry.push({ base: current.base, at: total + 3 });
}

/* ---------- Session (le quiz reprend où on l'a laissé) ---------- */
const getVals = () => Object.fromEntries([...document.querySelectorAll('.quiz-target-input')].map(i => [i.dataset.key, i.value]));
function saveSession(){
  if (!current) return;
  store.set('session', { mode, score, total, streak, retry, cur: current.base, givenKey, answered, vals: getVals(), tab, quizList });
}
function restoreSession(){
  const s = store.get('session', null);
  const v = s && verbsData.find(x => x.base === s.cur);
  if (!v || !keys.includes(s.givenKey)) return initQuiz();
  mode = s.mode === 'all' ? 'all' : 'srs';
  quizList = listById(s.quizList) ? s.quizList : 'all';
  syncMode();
  score = s.score|0; total = s.total|0; streak = s.streak|0; retry = Array.isArray(s.retry) ? s.retry : [];
  current = v; givenKey = s.givenKey;
  renderQuestion(s.vals || {}, false);
  if (s.answered){ answered = true; markAnswer(); }
  if (s.tab === 'list') switchTab('list');
}

/* ---------- Quiz ---------- */
const syncMode = () => syncSeg('mode-seg', mode);
function setMode(m){ if (m === mode) return; mode = m; syncMode(); initQuiz(); }
function initQuiz(){
  score = 0; total = 0; streak = 0; retry = []; current = null; lastRetry = false;
  loadQuestion();
}

function loadQuestion(){
  current = pickNext();
  givenKey = keys[Math.floor(Math.random() * keys.length)];
  renderQuestion({}, true);
  saveSession();
}

const esc = t => String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function renderQuestion(vals, focus){
  answered = false;
  document.getElementById('q-prompt-text').textContent = `Complète la ligne dans l'ordre. L'indice est déjà rempli.`;
  document.getElementById('quiz-inputs-container').innerHTML = keys.map(k => k === givenKey ? `
    <div class="input-group given">
      <label>${meta[k]} <em>(indice)</em></label>
      <div class="given-row"><input type="text" value="${esc(current[k])}" disabled aria-label="Indice">${k !== 'french' ? '<button type="button" class="speak-btn" onclick="speakGiven()" aria-label="Écouter en anglais">🔊</button>' : ''}</div>
    </div>` : `
    <div class="input-group">
      <label for="in-${k}">${meta[k]}</label>
      <input id="in-${k}" type="text" class="quiz-target-input" data-key="${k}" value="${esc(vals[k] || '')}" placeholder="${meta[k]}..." autocomplete="off" autocapitalize="none" spellcheck="false" oninput="updateSubmit()">
      <div class="answer"></div>
    </div>`).join('');
  document.getElementById('q-feedback').innerHTML = (mode === 'srs' && !dueList().length) ? '<div class="note">🎉 Tout est à jour : révision libre</div>' : '';
  document.getElementById('next-btn').disabled = true;
  updateSubmit(); updateStats();
  if (focus) document.querySelector('.quiz-target-input')?.focus();
}

function updateStats(){
  document.getElementById('score-text').innerHTML = `<strong>${score} / ${total}</strong><small>Score</small>`;
  document.getElementById('streak-text').innerHTML = `<strong>🔥 ${streak}</strong><small>Série</small>`;
  document.getElementById('due-text').innerHTML = `<strong>📌 ${dueList().length}</strong><small>À revoir</small>`;
  const P = poolVerbs();
  const m = Math.round(P.reduce((a,v) => a + entry(v).box, 0) / (P.length * (GAPS.length - 1)) * 100);
  document.getElementById('mastery-text').textContent = `Maîtrise : ${m} %`;
  document.getElementById('mastery-bar').style.width = m + '%';
}

const speakGiven = () => speak(current[givenKey]);
const speakAll = () => speak(`${current.base}. ${current.preterit}. ${current.participle}.`);

function updateSubmit(){
  const all = [...document.querySelectorAll('.quiz-target-input')].every(i => i.value.trim());
  document.getElementById('submit-btn').disabled = !all || answered;
  saveSession();
}

/* Affiche la correction (sans modifier le score) */
function markAnswer(){
  let allOk = true;
  document.querySelectorAll('.quiz-target-input').forEach(inp => {
    const k = inp.dataset.key, ok = isCorrect(inp.value, current[k]);
    inp.classList.add(ok ? 'ok' : 'ko'); inp.disabled = true;
    if (!ok){ allOk = false; inp.parentElement.querySelector('.answer').textContent = `Attendu : ${current[k]}`; }
  });
  document.getElementById('q-feedback').innerHTML = (allOk
    ? '<span class="ok-text">✅ Bravo ! Tout est correct.</span>'
    : '<span class="ko-text">❌ Pas tout à fait, il reviendra bientôt.</span>')
    + '<button type="button" class="speak-btn speak-all" onclick="speakAll()">🔊 Écouter les 3 formes</button>';
  document.getElementById('submit-btn').disabled = true;
  document.getElementById('next-btn').disabled = false;
  return allOk;
}

function checkAnswer(){
  if (answered) return;
  answered = true;
  const ok = markAnswer();
  total++;
  if (ok){ score++; streak++; } else { streak = 0; }
  record(ok);
  updateStats(); saveSession();
  document.getElementById('next-btn').focus();
}

function nextQuestion(){ loadQuestion(); }

function resetStats(){
  if (!confirm("Effacer toute ta progression ?")) return;
  srs = {}; store.del('srs'); store.del('session');
  document.getElementById('settings').close();
  initQuiz();
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || tab !== 'quiz' || document.querySelector('dialog[open]')) return;
  if (e.target.closest('.speak-btn, .gear, .acc')) return;
  if (!answered){ if (!document.getElementById('submit-btn').disabled) checkAnswer(); }
  else if (e.target.id !== 'next-btn') nextQuestion();
});

/* ---------- Liste ---------- */
function switchTab(t){
  tab = t;
  for (const x of ['quiz','list']){
    document.getElementById('tab-'+x).classList.toggle('active', x === t);
    document.getElementById(x+'-section').classList.toggle('active', x === t);
  }
  if (t === 'list') renderTables();
  saveSession();
}

function buildControls(){
  document.getElementById('controls-row').innerHTML = keys.map((k,i) =>
    `<button class="toggle-col-btn" id="btn-col-${i}" onclick="toggleColumn(${i})"></button>`).join('');
  keys.forEach((_,i) => updateToggleLabel(i));
}
function updateToggleLabel(i){
  const b = document.getElementById('btn-col-'+i);
  b.textContent = (hiddenCols[i] ? 'Afficher ' : 'Masquer ') + short[keys[i]];
  b.classList.toggle('hidden-col', hiddenCols[i]);
}
function toggleColumn(i){
  hiddenCols[i] = !hiddenCols[i]; store.set('hiddenCols', hiddenCols);
  updateToggleLabel(i); renderTables();
}

function cellTap(el, n, k){
  const span = el.querySelector('span');
  if (span.classList.contains('hidden-text')){ span.classList.remove('hidden-text'); return; }
  if (k !== 'french') speak(verbsData[n][k]);
}
function jumpTo(l){ document.getElementById('L-' + l)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
function renderTables(){
  const q = norm(document.getElementById('search-input').value);
  const L = listById(viewList);
  const rows = verbsData.map((v,n) => [v,n]).filter(([v]) => (!L || L.bases.includes(v.base)) && keys.some(k => norm(v[k]).includes(q)));
  const head = `<div class="vrow vhead">${keys.map(k => `<div class="${k === 'french' ? 'fr' : ''}">${short[k]}</div>`).join('')}</div>`;
  let last = '';
  const html = rows.map(([v,n]) => {
    const l = v.base[0].toUpperCase();
    const id = l !== last ? ` id="L-${l}"` : ''; last = l;
    return `<div class="vrow"${id}>${keys.map((k,i) =>
      `<div class="vcell ${k === 'french' ? 'fr' : 'en'} c-${k}" data-label="${short[k]}" onclick="cellTap(this,${n},'${k}')">${k !== 'french' ? '<button type="button" class="speak-btn mini" tabindex="-1" aria-label="Écouter">🔊</button>' : ''}<span class="${hiddenCols[i] ? 'hidden-text' : ''}">${v[k]}</span></div>`).join('')}</div>`;
  }).join('');
  document.getElementById('tables-container').innerHTML = rows.length ? `<div class="vlist">${head}${html}</div>` : '<p class="empty">Aucun verbe trouvé.</p>';
  document.getElementById('az').innerHTML = [...new Set(rows.map(([v]) => v.base[0].toUpperCase()))]
    .map(l => `<button type="button" onclick="jumpTo('${l}')">${l}</button>`).join('');
}

/* ---------- Listes personnalisées ---------- */
function renderChips(){
  for (const w of ['quiz','list']){
    const cur = w === 'quiz' ? quizList : viewList;
    document.getElementById('chips-' + w).innerHTML =
      `<button type="button" class="chip plus" onclick="openListEditor()" aria-label="Créer une liste">＋</button>` +
      `<button type="button" class="chip ${cur === 'all' ? 'active' : ''}" onclick="selectList('${w}','all')">Tous</button>` +
      lists.map(l => `<button type="button" class="chip ${cur === l.id ? 'active' : ''}" onclick="selectList('${w}','${l.id}')">${esc(l.name)}</button>`).join('');
  }
  const L = listById(viewList);
  document.getElementById('list-actions').innerHTML = L
    ? `<div class="list-actions"><span>${L.bases.length} verbe${L.bases.length > 1 ? 's' : ''}</span><button type="button" class="mini-btn" onclick="openListEditor('${L.id}')">✏️ Modifier</button><button type="button" class="mini-btn" onclick="deleteList('${L.id}')">🗑️ Supprimer</button></div>` : '';
}
function selectList(w, id){
  if (w === 'quiz'){ if (id === quizList) return; quizList = id; renderChips(); initQuiz(); }
  else { viewList = id; renderChips(); renderTables(); }
}
function fixSelections(){
  let quizLost = false;
  if (quizList !== 'all' && !listById(quizList)){ quizList = 'all'; quizLost = true; }
  if (viewList !== 'all' && !listById(viewList)) viewList = 'all';
  return quizLost;
}
function persistLists(){ store.set('lists', lists); cloudSave(); renderChips(); }

let editId = null, pickSel = new Set();
function openListEditor(id){
  editId = typeof id === 'string' ? id : null;
  const l = editId && listById(editId);
  document.getElementById('le-title').textContent = l ? 'Modifier la liste' : 'Nouvelle liste';
  document.getElementById('le-name').value = l ? l.name : '';
  document.getElementById('le-search').value = '';
  document.getElementById('le-error').textContent = '';
  pickSel = new Set(l ? l.bases : []);
  renderPicker();
  document.getElementById('list-editor').showModal();
}
const updatePickCount = () => { const n = pickSel.size; document.getElementById('le-count').textContent = `${n} verbe${n > 1 ? 's' : ''} sélectionné${n > 1 ? 's' : ''}`; };
function renderPicker(){
  const q = norm(document.getElementById('le-search').value);
  document.getElementById('le-picker').innerHTML = verbsData.filter(v => !q || keys.some(k => norm(v[k]).includes(q)))
    .map(v => `<label class="pick"><input type="checkbox" value="${esc(v.base)}" ${pickSel.has(v.base) ? 'checked' : ''}><b>${v.base}</b><span>${v.french}</span></label>`).join('');
  updatePickCount();
}
document.getElementById('le-picker').addEventListener('change', e => {
  const c = e.target; if (c.type !== 'checkbox') return;
  c.checked ? pickSel.add(c.value) : pickSel.delete(c.value); updatePickCount();
});
function clearPicker(){ pickSel.clear(); renderPicker(); }
function saveList(){
  const name = document.getElementById('le-name').value.trim(), err = document.getElementById('le-error');
  if (!name){ err.textContent = 'Donne un nom à ta liste.'; return; }
  if (!pickSel.size){ err.textContent = 'Choisis au moins un verbe.'; return; }
  const bases = verbsData.filter(v => pickSel.has(v.base)).map(v => v.base);
  const existing = editId && listById(editId);
  if (existing) Object.assign(existing, { name, bases });
  else { editId = 'l' + Date.now().toString(36); lists.push({ id: editId, name, bases }); }
  persistLists();
  document.getElementById('list-editor').close();
  if (tab === 'quiz'){ quizList = ''; selectList('quiz', editId); } else selectList('list', editId);
}
function deleteList(id){
  const l = listById(id); if (!l || !confirm(`Supprimer la liste « ${l.name} » ?`)) return;
  lists = lists.filter(x => x.id !== id);
  const lost = fixSelections(); persistLists(); renderTables(); if (lost) initQuiz();
}

/* ---------- Compte (Firebase, facultatif) ---------- */
const cloud = { ready: false, user: null, error: '' };
let unsubCloud = null, firstSnap = true;
async function initCloud(){
  if (!FIREBASE_CONFIG) return;
  try {
    const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const [appM, A, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    const app = appM.initializeApp(FIREBASE_CONFIG);
    cloud.A = A; cloud.F = F; cloud.auth = A.getAuth(app); cloud.db = F.getFirestore(app);
    A.onAuthStateChanged(cloud.auth, user => {
      cloud.user = user; cloud.ready = true;
      if (unsubCloud){ unsubCloud(); unsubCloud = null; }
      if (user){ firstSnap = true; subscribeCloud(user); }
      renderAccount();
    });
  } catch (e){ cloud.error = 'Connexion au service impossible (es-tu hors-ligne ?).'; renderAccount(); }
}
function subscribeCloud(user){
  unsubCloud = cloud.F.onSnapshot(cloud.F.doc(cloud.db, 'users', user.uid), snap => {
    const remote = snap.exists() && Array.isArray(snap.data().lists) ? snap.data().lists : [];
    if (firstSnap){
      firstSnap = false;
      const ids = new Set(remote.map(l => l.id)), extra = lists.filter(l => !ids.has(l.id));
      lists = [...remote, ...extra];
      if (extra.length) cloudSave();
    } else lists = remote;
    store.set('lists', lists);
    const lost = fixSelections(); renderChips(); renderTables(); if (lost) initQuiz();
  }, () => {});
}
function cloudSave(){
  if (!cloud.user) return;
  cloud.F.setDoc(cloud.F.doc(cloud.db, 'users', cloud.user.uid), { lists, updatedAt: Date.now() }).catch(() => {});
}
const AUTH_ERRORS = {
  'auth/invalid-email': 'E-mail invalide.', 'auth/weak-password': 'Mot de passe trop court (6 caractères minimum).',
  'auth/email-already-in-use': 'Un compte existe déjà avec cet e-mail.', 'auth/network-request-failed': 'Pas de connexion internet.',
  'auth/invalid-credential': 'E-mail ou mot de passe incorrect.', 'auth/wrong-password': 'E-mail ou mot de passe incorrect.',
  'auth/user-not-found': 'E-mail ou mot de passe incorrect.', 'auth/too-many-requests': 'Trop d\'essais, réessaie plus tard.'
};
async function authSubmit(kind){
  const email = document.getElementById('acc-email').value.trim(), pw = document.getElementById('acc-pw').value;
  const err = document.getElementById('acc-err'); err.textContent = '';
  if (!email || !pw){ err.textContent = 'Entre ton e-mail et ton mot de passe.'; return; }
  try {
    if (kind === 'up') await cloud.A.createUserWithEmailAndPassword(cloud.auth, email, pw);
    else await cloud.A.signInWithEmailAndPassword(cloud.auth, email, pw);
  } catch (e){ err.textContent = AUTH_ERRORS[e.code] || 'Une erreur est survenue, réessaie.'; }
}
async function signOutUser(){
  await cloud.A.signOut(cloud.auth);
  lists = []; store.set('lists', lists);
  const lost = fixSelections(); renderChips(); renderTables(); if (lost) initQuiz();
  document.getElementById('account').close();
}
function renderAccount(){
  const box = document.getElementById('account-body');
  document.getElementById('acc-dot').hidden = !cloud.user;
  if (!FIREBASE_CONFIG && !cloud.ready)
    box.innerHTML = '<p class="note-p">Les comptes en ligne ne sont pas encore activés. Tes listes sont enregistrées sur cet appareil.</p>';
  else if (cloud.error) box.innerHTML = `<p class="err">${cloud.error}</p>`;
  else if (!cloud.ready) box.innerHTML = '<p class="note-p">Chargement…</p>';
  else if (cloud.user) box.innerHTML = `<p class="note-p">Connecté : <b>${esc(cloud.user.email || '')}</b><br>☁️ Tes listes sont synchronisées.</p><button class="btn secondary" onclick="signOutUser()">Se déconnecter</button>`;
  else box.innerHTML = `<p class="note-p">Connecte-toi pour retrouver tes listes sur tous tes appareils.</p>
    <input id="acc-email" class="search-bar" type="email" placeholder="E-mail" autocomplete="email">
    <input id="acc-pw" class="search-bar" type="password" placeholder="Mot de passe (6 caractères min.)" autocomplete="current-password" onkeydown="if(event.key==='Enter')authSubmit('in')">
    <div class="err" id="acc-err"></div>
    <button class="btn" onclick="authSubmit('in')">Se connecter</button>
    <button class="btn secondary" onclick="authSubmit('up')">Créer un compte</button>`;
}
function openAccount(){ renderAccount(); document.getElementById('account').showModal(); }

applySettings(); buildControls(); restoreSession(); renderChips(); renderAccount(); initCloud();

/* ---------- PWA ---------- */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
