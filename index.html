<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Révision des Verbes Irréguliers</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #22c55e;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            max-width: 600px;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 25px;
            margin-bottom: 30px;
        }

        /* Navigation / Onglets */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .section-view {
            display: none;
        }

        .section-view.active {
            display: block;
        }

        /* Mode Quiz */
        .quiz-card {
            background: #f8fafc;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            margin-bottom: 20px;
        }

        .quiz-category {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .quiz-prompt {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .quiz-verb-display {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 20px;
        }

        .quiz-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        @media(max-width: 600px) {
            .quiz-inputs {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        .input-group input {
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .quiz-feedback {
            margin-top: 15px;
            font-weight: 600;
            font-size: 1.1rem;
            min-height: 30px;
        }

        .feedback-correct {
            color: var(--success);
        }

        .feedback-incorrect {
            color: var(--error);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 15px;
        }

        /* Mode Liste / Tableaux */
        .search-bar {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 20px;
            outline: none;
        }

        .search-bar:focus {
            border-color: var(--primary);
        }

        .category-group {
            margin-bottom: 25px;
        }

        .category-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            border-left: 4px solid var(--primary);
            padding-left: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        th {
            background: #f1f5f9;
            font-weight: 600;
            color: var(--text-main);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .controls-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .toggle-col-btn {
            background: #e2e8f0;
            color: var(--text-main);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .toggle-col-btn.hidden-col {
            background: #cbd5e1;
            text-decoration: line-through;
        }

        .hidden {
            filter: blur(5px);
            user-select: none;
            cursor: pointer;
            transition: filter 0.2s;
        }

        .hidden:hover {
            filter: blur(0px);
        }
    </style>
</head>
<body>

    <header>
        <h1>Révision des Verbes Irréguliers</h1>
        <p class="subtitle">Entraîne-toi et maîtrise tes fiches de cours par cœur !</p>
    </header>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('quiz')">Mode Quiz</button>
            <button class="tab-btn" onclick="switchTab('list')">Tableaux de Révision</button>
        </div>

        <!-- SECTION QUIZ -->
        <div id="quiz-section" class="section-view active">
            <div class="stats-bar">
                <span id="score-text">Score : 0 / 0</span>
                <span id="progress-text">Verbe 1 sur 26</span>
            </div>

            <div class="quiz-card">
                <div class="quiz-category" id="q-category">Catégorie</div>
                <div class="quiz-prompt">Trouve les formes pour :</div>
                <div class="quiz-verb-display" id="q-base">Base Verbale (Traduction)</div>

                <div class="quiz-inputs">
                    <div class="input-group">
                        <label for="input-preterit">Prétérit</label>
                        <input type="text" id="input-preterit" placeholder="ex: went" autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label for="input-participe">Participe Passé</label>
                        <input type="text" id="input-participe" placeholder="ex: gone" autocomplete="off">
                    </div>
                </div>

                <button class="btn" id="submit-btn" onclick="checkAnswer()">Valider</button>
                <div class="quiz-feedback" id="q-feedback"></div>
            </div>
            <button class="btn" style="background:#64748b;" onclick="nextQuestion()">Passer / Verbe Suivant</button>
        </div>

        <!-- SECTION LISTE & TABLEAUX -->
        <div id="list-section" class="section-view">
            <input type="text" class="search-bar" id="search-input" placeholder="🔍 Rechercher un verbe ou une traduction..." onkeyup="filterTable()">
            
            <div class="controls-row">
                <span style="font-size:0.85rem; font-weight:600; align-self:center;">Cacher / Afficher :</span>
                <button class="toggle-col-btn" id="btn-col-1" onclick="toggleColumn(1)">Prétérit</button>
                <button class="toggle-col-btn" id="btn-col-2" onclick="toggleColumn(2)">Participe Passé</button>
                <button class="toggle-col-btn" id="btn-col-3" onclick="toggleColumn(3)">Traduction</button>
            </div>

            <div id="tables-container">
                <!-- Généré dynamiquement par JS -->
            </div>
        </div>
    </div>

    <script>

            { base: "Drive", preterit: "Drove", participle: "Driven", french: "Conduire", category: "Participes passés en 'EN'" },

            { base: "Forgive", preterit: "Forgave", participle: "Forgiven", french: "Pardonner", category: "Participes passés en 'EN'" },
            { base: "Give", preterit: "Gave", participle: "Given", french: "Donner", category: "Participes passés en 'EN'" },
            { base: "Hide", preterit: "Hid", participle: "Hidden", french: "(se) cacher", category: "Participes passés en 'EN'" },
            { base: "Speak", preterit: "Spoke", participle: "Spoken", french: "Parler", category: "Participes passés en 'EN'" },
            { base: "Steal", preterit: "Stole", participle: "Stolen", french: "Voler, dérober", category: "Participes passés en 'EN'" },
            { base: "Write", preterit: "Wrote", participle: "Written", french: "Écrire", category: "Participes passés en 'EN'" }
